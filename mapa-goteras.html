<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0">

<title>Mapa de Goteras – GPS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body { margin: 0; font-family: Arial; }
  #map { height: 100vh; width: 100%; }

  /* Botón flotante */
  .btn-gps {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #2196F3;
    color: white;
    border: none;
    border-radius: 50%;
    width: 70px;
    height: 70px;
    font-size: 28px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    z-index: 1000;
  }

  .info {
    position: fixed;
    top: 10px;
    left: 10px;
    background: white;
    padding: 8px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 1000;
  }
</style>
</head>

<body>

<div class="info">📍 Presiona el botón azul para marcar tu ubicación</div>
<div id="map"></div>
<button class="btn-gps" onclick="marcarGPS()">📍</button>

<script>
const latInicial = 13.809185;
const lonInicial = -89.352184;

// Crear mapa
const map = L.map("map").setView([latInicial, lonInicial], 18);

// Capa satélite
L.tileLayer(
  "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
  {
    maxZoom: 22,
    subdomains: ["mt0","mt1","mt2","mt3"]
  }
).addTo(map);

let contador = 1;

// Cargar marcadores guardados
let marcadoresGuardados = JSON.parse(localStorage.getItem("goteraData")) || [];

marcadoresGuardados.forEach(m => {
  crearMarcador(L.latLng(m.lat, m.lng), m.desc);
});

// 📍 FUNCIÓN GPS PRINCIPAL
function marcarGPS() {
  if (!navigator.geolocation) {
    alert("Tu navegador no soporta GPS");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const coords = L.latLng(lat, lon);

    map.setView(coords, 20);

    const descripcion = prompt("Descripción:", "Gotera " + contador);
    if (!descripcion) return;

    crearMarcador(coords, descripcion);

    guardarMarcador(lat, lon, descripcion);

    contador++;

  }, () => {
    alert("No se pudo obtener ubicación");
  });
}

// Crear marcador
function crearMarcador(latlng, descripcion) {

  const marker = L.marker(latlng, { draggable: true }).addTo(map);

  marker.bindPopup(crearPopup(descripcion, latlng)).openPopup();

  marker.on("dragend", () => {
    const p = marker.getLatLng();
    marker.setPopupContent(crearPopup(descripcion, p));
  });
}

// Guardar en localStorage
function guardarMarcador(lat, lon, desc) {
  marcadoresGuardados.push({ lat, lng: lon, desc });
  localStorage.setItem("goteraData", JSON.stringify(marcadoresGuardados));
}

// Popup
function crearPopup(desc, coords) {
  return `
    <b>${desc}</b><br>
    Lat: ${coords.lat.toFixed(6)}<br>
    Lon: ${coords.lng.toFixed(6)}<br>
    <small>📱 Creado con GPS</small>
  `;
}
</script>

</body>
</html>
